[project]
name = "assignflow-backend"
version = "0.5.0"
description = "AssignFlow backend (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
# Compatible-release constraints. Faker is pinned exactly so the fixed-seed demo names stay
# identical across rebuilds (architecture §11, §13.4).
dependencies = [
    "fastapi~=0.115",
    "uvicorn~=0.34",
    "pydantic-settings~=2.7",
    "psycopg[binary]~=3.2",
    "redis~=5.2",
    "httpx~=0.28",
    "sqlalchemy~=2.0",
    "alembic~=1.14",
    "pwdlib[argon2]~=0.2",
    "faker==40.43.0",
    "boto3~=1.35",
    "pyjwt~=2.10",
    "slowapi~=0.1.9",
    "python-multipart~=0.0.20",
    "filetype~=1.2",
]

[project.optional-dependencies]
# Installed in the image too so `docker compose run --rm backend pytest` works (architecture §24.3).
dev = [
    "pytest~=8.3",
    "ruff~=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
cache-dir = "/tmp/.ruff_cache"
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# str+Enum mixins are kept deliberately (SQLAlchemy Enum / JSON friendliness)
ignore = ["UP042"]
per-file-ignores = { "tests/**" = ["E501"], "tests/conftest.py" = ["E402", "E501"] }

[tool.ruff.lint.isort]
known-third-party = ["alembic"]


[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations in argument defaults are the framework idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "app.core.deps.require_role"]
